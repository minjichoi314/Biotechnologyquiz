      "difficulty": "상",
      "question": "다음은 식물세포 융합 과정의 일부를 순서 없이 나열한 것이다. (가) 융합된 세포의 세포벽 재생 유도. (나) 효소를 이용한 세포벽 제거. (다) 융합 세포의 배양. (라) 토마토와 감자의 세포융합. 옳은 순서를 고르시오.",
      "options": [
        "(가) → (나) → (다) → (라)",
        "(라) → (다) → (나) → (가)",
        "(나) → (라) → (가) → (다)",
        "(다) → (가) → (라) → (나)"
      ],
      "answer": 2
    },
    {
      "id": "fusion-30",
      "unit": "fusion",
      "n": 30,
      "difficulty": "상",
      "question": "세포융합 기술에 대한 최종 결론으로, 자료의 장점·한계·활용 가능성을 가장 균형 있게 반영한 것은?",
      "options": [
        "유용한 형질을 합칠 수 있으니 안전성 검토는 필요하지 않다",
        "다음 세대에 유전되지 않으므로 모든 활용을 포기해야 한다",
        "유용한 특성 결합과 유전·안전·윤리 문제를 함께 고려한다",
        "세포융합은 농업에서만 사용되며 의료·미생물에는 쓸 수 없다"
      ],
      "answer": 2
    }
  ]
}</script>

<script>
(() => {
'use strict';
const DATA=JSON.parse(document.getElementById('quizData').textContent);
const U=DATA.units, Q=DATA.questions, NUM=['①','②','③','④'];
const app=document.getElementById('app'), sign=document.getElementById('hangingSign');
const index=new Map(Q.map(q=>[q.id,q]));
const STORAGE='life-tech-quiz-20-round-v4';
const LEGACY_STORAGE='life-tech-quiz-20-round-v3';
const ROUND_SIZE=20;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const settings={unit:'all',difficulty:'all'};
const state={screen:'home',queue:[],index:0,results:[],answered:false,wrongReview:false,scopeKey:''};
const validQs=Q.every(q=>q.options.length===4&&q.options.every(o=>Array.from(o).length<=150)&&q.answer>=0&&q.answer<=3);
if(!validQs){app.textContent='문제 데이터 검증 중 오류가 발생했습니다. 관리자에게 알려주세요.';return;}
let best={}, completedByScope={};
try {
  // 기존 버전의 단원/난이도 설정과 최고 점수는 유지합니다.
  const stored=localStorage.getItem(STORAGE);
  const store=JSON.parse(stored||localStorage.getItem(LEGACY_STORAGE)||'{}');
  if(store.settings){settings.unit=store.settings.unit||'all';settings.difficulty=store.settings.difficulty||'all';}
  if(settings.unit!=='all'&&!U[settings.unit])settings.unit='all';
  if(!['all','하','중','상'].includes(settings.difficulty))settings.difficulty='all';
  best=store.best||{};
  completedByScope=store.completedByScope&&typeof store.completedByScope==='object'?store.completedByScope:{};
  if(store.session?.queue?.length){
    Object.assign(state,store.session);
    state.queue=state.queue.filter(id=>index.has(id));
    state.results=state.results.filter(r=>index.has(r.id));
    if(state.index>=state.queue.length)state.screen='result';
  }
}catch(e){/* Browser storage can be disabled. */}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({settings,best,completedByScope,session:state.screen==='home'?null:state}));}catch(e){}}
function shuffled(list){const a=list.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function unitPool(){return Q.filter(q=>settings.unit==='all'||settings.unit===q.unit);}
function allFiltered(){return unitPool().filter(q=>settings.difficulty==='all'||settings.difficulty===q.difficulty);}
function scopeKey(){return `${settings.unit}/${settings.difficulty}`;}
// 20문항을 중복 없이 우선 출제합니다. 한 단원의 특정 난이도는 10문항뿐이므로
// 부족한 10문항은 같은 단원의 다른 난이도로 채웁니다.
function nextRound(){
 const key=scopeKey(), chosen=allFiltered(), chosenIds=new Set(chosen.map(q=>q.id));
 const extra=unitPool().filter(q=>!chosenIds.has(q.id));
 let seen=new Set(Array.isArray(completedByScope[key])?completedByScope[key]:[]);
 if([...chosen,...extra].every(q=>seen.has(q.id)))seen=new Set();
 const order=[
   ...shuffled(chosen.filter(q=>!seen.has(q.id))),
   ...shuffled(extra.filter(q=>!seen.has(q.id))),
   ...shuffled(chosen.filter(q=>seen.has(q.id))),
   ...shuffled(extra.filter(q=>seen.has(q.id)))
 ];
 return order.slice(0,ROUND_SIZE);
}
function score(){return state.results.filter(r=>r.correct).length;}
function wrongResults(){return state.results.filter(r=>!r.correct);}
function getQuestion(){return index.get(state.queue[state.index]);}
function pill(group,value,label){return `<button type="button" data-set="${group}" data-value="${value}" class="pill ${settings[group]===value?'active':''}" aria-pressed="${settings[group]===value}">${safe(label)}</button>`;}
function home(){
 sign.textContent='생명기술 퀴즈, 도전해봐요!';
 const available=allFiltered().length;
 app.innerHTML=`<section class="screen">
 <p class="topline">과학 시간에 펼쳐지는 생명 기술 탐험</p><h1 class="hero chalk">생명기술 퀴즈 도전!</h1><div class="underline-chalk"></div>
 <p class="subhead">유전자 재조합 · 핵이식 · 조직배양 · 세포융합<br><strong>상·중·하 120문항 · 4지선다형</strong></p>
 <div class="unit-grid" role="group" aria-label="학습 단원 선택">
 <button class="unit all ${settings.unit==='all'?'active':''}" data-set="unit" data-value="all" aria-pressed="${settings.unit==='all'}"><span class="unit-count">ALL</span><span class="unit-title">모든 단원</span><small>총 120문항</small></button>
 ${Object.entries(U).map(([key,u],i)=>`<button class="unit ${settings.unit===key?'active':''}" data-set="unit" data-value="${key}" aria-pressed="${settings.unit===key}"><span class="unit-count">0${i+1}</span><span class="unit-title">${safe(u.name)}</span><small>30문항</small></button>`).join('')}</div>
 <div class="settings-row"><div class="setting-group"><span class="setting-label">난이도</span>${pill('difficulty','all','전체')}${pill('difficulty','하','하')}${pill('difficulty','중','중')}${pill('difficulty','상','상')}</div></div>
 <div class="center start-area"><span class="round-badge">매회 20문항씩 출제</span><button class="primary" data-action="start">20문항 퀴즈 시작하기 →</button><p class="small-note">${settings.unit==='all'&&settings.difficulty==='all'?'120문항을 중복 없이 우선 출제하여 6회에 걸쳐 학습할 수 있어요.':settings.unit!=='all'&&settings.difficulty!=='all'?'선택한 난이도는 10문항이므로, 같은 단원의 다른 난이도에서 10문항을 보충해 총 20문항 출제합니다.':`선택 범위 ${available}문항에서 중복을 최소화해 20문항 출제합니다.`}<br>네 개의 보기에서 정답 하나를 선택하세요. 오답 복습은 틀린 문항 수만큼 진행됩니다.</p></div></section>`;
}
function start(reviewIDs=null){
 const arr=reviewIDs?reviewIDs.map(id=>index.get(id)).filter(Boolean):nextRound();
 if(!arr.length)return;
 Object.assign(state,{screen:'quiz',queue:arr.map(q=>q.id),index:0,results:[],answered:false,wrongReview:!!reviewIDs,scopeKey:reviewIDs?'':scopeKey()});
 persist(); render();
}
function answer(choice){
 if(state.screen!=='quiz'||state.answered||!Number.isInteger(choice)||choice<0||choice>3)return;
 const q=getQuestion();
 state.results.push({id:q.id,chosen:choice,correct:choice===q.answer});
 state.answered=true;persist();render();
}
function quiz(){
 sign.textContent='정답을 선택해보세요!';
 const q=getQuestion();if(!q){state.screen='result';return result();}
 const current=state.index+1,total=state.queue.length;
 const last=state.answered?state.results.at(-1):null;
 const answerMarkup=`<div class="answers" role="group" aria-label="정답 선택">${q.options.map((opt,i)=>{
   let klass='';if(state.answered){if(i===q.answer)klass='correct';else if(i===last.chosen)klass='wrong';}
   const marker=state.answered&&i===q.answer?'<span class="answer-marker">정답</span>':state.answered&&i===last.chosen?'<span class="answer-marker">내 선택</span>':'';
   return `<button type="button" class="choice ${klass}" data-answer="${i}" ${state.answered?'disabled':''}><span class="choice-index">${NUM[i]}</span><span class="choice-text">${safe(opt)}</span>${marker}</button>`;
 }).join('')}</div>`;
 const feedback=state.answered?`<div class="feedback ${last.correct?'good':'bad'}" role="status"><span class="feedback-tag">${last.correct?'정답':'오답'}</span><div><div class="feedback-title">${last.correct?'정답입니다!':'다음 문제에서 다시 도전해보세요.'}</div><div class="feedback-note">정답: <strong>${NUM[q.answer]} ${safe(q.options[q.answer])}</strong></div></div></div>`:'';
 app.innerHTML=`<section class="screen question-card"><div class="screen-bar"><button class="ghost" data-action="back">← 단원 선택</button><div class="screen-label">${safe(U[q.unit].name)} · ${q.difficulty} 수준 · ${q.n}번</div><div class="screen-progress">${current} / ${total} 문항</div></div>
 <div class="progress-track" role="progressbar" aria-label="문제 진행률" aria-valuenow="${current}" aria-valuemax="${total}"><div class="progress-bar" style="width:${Math.round(current/total*100)}%"></div></div>
 <div class="question-number">QUESTION ${String(current).padStart(2,'0')}</div><h1 class="question-title chalk">Q. ${safe(q.question)}</h1><div class="underline-chalk" style="max-width:180px;height:9px;margin-bottom:21px"></div>
 ${answerMarkup}${feedback}<div class="quiz-controls">${state.answered?`<button class="primary" data-action="next">${current===total?'결과 확인하기 →':'다음 문제 →'}</button>`:'<span class="tip">정답을 선택해 보세요!</span>'}</div>
 <p class="tip">현재 정답 ${score()}개 · 키보드 1~4로 답 선택, Enter로 다음 문제</p></section>`;
}
function next(){
 if(!state.answered)return;
 if(state.index+1>=state.queue.length){
   state.screen='result';
   if(!state.wrongReview){
     const key=state.scopeKey||scopeKey();
     completedByScope[key]=[...new Set([...(completedByScope[key]||[]),...state.queue])];
     best[key]=Math.max(best[key]||0,Math.round(score()/state.queue.length*100));
   }
 }
 else{state.index++;state.answered=false;}
 persist();render();
}
function result(){
 sign.textContent='퀴즈 결과를 확인하세요!';
 const total=state.queue.length,s=score(),incorrect=wrongResults(),percent=total?Math.round(s/total*100):0;
 const message=percent===100?'모든 문제 정답!':percent>=80?'아주 잘했어요!':percent>=60?'좋은 성적이에요!':'오답을 복습해볼까요?';
 app.innerHTML=`<section class="screen"><p class="topline">QUIZ FINISHED</p><h1 class="hero chalk">${message}</h1><div class="underline-chalk"></div><div class="result-score">${percent}점 <span style="font-size:17px;color:white">(${s}/${total}문항 정답)</span></div>
 <div class="result-panel"><div class="result-stats"><div class="stat"><strong>${total}</strong><small>푼 문제</small></div><div class="stat"><strong>${s}</strong><small>정답</small></div><div class="stat"><strong>${incorrect.length}</strong><small>오답</small></div></div><p style="font-weight:850;font-size:14px;line-height:1.6">${state.wrongReview?'오답 다시 풀기가 끝났습니다.':'4개 생명 기술의 핵심 내용을 복습해보세요.'}</p></div>
 <div class="quiz-controls"><button class="secondary" data-action="home">단원 선택</button><button class="primary" data-action="again">다음 20문항 풀기</button>${incorrect.length?'<button class="secondary" data-action="retry-wrong">오답 다시 풀기</button><button class="secondary" data-action="download-wrong">오답노트 저장</button>':''}</div>
 ${incorrect.length?`<div class="wrong-list"><h2 style="margin:11px 0 4px;color:#ffedab;font-size:20px;text-align:center">틀린 문제 살펴보기 (${incorrect.length})</h2>${incorrect.map(r=>{const q=index.get(r.id);return `<details class="wrong-item"><summary>${safe(U[q.unit].name)} ${q.n}번 · ${safe(q.question)}</summary><p><b>정답:</b> ${NUM[q.answer]} ${safe(q.options[q.answer])}</p><p><b>내 답:</b> ${NUM[r.chosen]} ${safe(q.options[r.chosen])}</p></details>`;}).join('')}</div>`:'<p class="center subhead">틀린 문제가 하나도 없습니다!</p>'}</section>`;
}
function wrongCsv(){
 const wrong=wrongResults();if(!wrong.length)return;
 const rows=[['단원','원래 문항 번호','난이도','문제','정답 번호','정답 보기','내 답']];
 for(const r of wrong){const q=index.get(r.id);rows.push([U[q.unit].name,q.n,q.difficulty,q.question,NUM[q.answer],q.options[q.answer],NUM[r.chosen]]);}
 const content='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');
 const blob=new Blob([content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
 link.href=url;link.download='생명기술_오답노트.csv';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function goHome(){Object.assign(state,{screen:'home',queue:[],index:0,results:[],answered:false,wrongReview:false,scopeKey:''});persist();render();}
function render(){if(state.screen==='quiz')quiz();else if(state.screen==='result')result();else home();window.scrollTo({top:0,behavior:'instant'});}
app.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!app.contains(b))return;
 const s=b.dataset.set,action=b.dataset.action,a=b.dataset.answer;
 if(s){settings[s]=b.dataset.value;persist();home();return;}
 if(a!==undefined){answer(Number(a));return;}
 if(action==='start')start();
 else if(action==='next')next();
 else if(action==='back'){if(window.confirm('진행 중인 퀴즈를 종료하고 단원 선택으로 돌아갈까요?'))goHome();}
 else if(action==='home')goHome();
 else if(action==='again')start();
 else if(action==='retry-wrong')start(wrongResults().map(r=>r.id));
 else if(action==='download-wrong')wrongCsv();
});
document.addEventListener('keydown',e=>{
 if(state.screen!=='quiz'||e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;
 if(state.answered){if(e.key==='Enter'){e.preventDefault();next();}return;}
 if('1234'.includes(e.key)&&e.key.length===1)answer(Number(e.key)-1);
});
render();
})();
</script>
</body></html>
